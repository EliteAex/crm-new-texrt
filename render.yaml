services:
  - type: web
    name: twenty-server
    runtime: image
    # Prebuilt by .github/workflows/docker-build-twenty.yml (target `twenty`:
    # server + frontend). Built on GitHub Actions runners because Render's
    # free build machines OOM on the twenty-front Vite build. Make the GHCR
    # package public after the first push, or configure a registry
    # credential in the Render dashboard if it stays private.
    image:
      url: ghcr.io/eliteaex/crm-new-texrt-twenty:latest
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_PORT
        value: 10000
      - key: DISABLE_CRON_JOBS_REGISTRATION
        value: "true"
      - key: PG_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: APP_SECRET
        sync: false
      - key: SIGN_IN_PREFILLED
        sync: false
      - key: IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS
        sync: false
      - key: FRONTEND_URL
        sync: false
