name: Build and push Twenty Docker image

on:
  push:
    branches: [main]
    paths:
      - "packages/twenty-docker/twenty/Dockerfile"
      - "packages/twenty-server/**"
      - "packages/twenty-front/**"
      - "packages/twenty-shared/**"
      - "packages/twenty-emails/**"
      - "packages/twenty-client-sdk/**"
      - "packages/twenty-ui/**"
      - ".github/workflows/docker-build-twenty.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          push: true
          tags: ghcr.io/eliteaex/crm-new-texrt-twenty:latest,ghcr.io/eliteaex/crm-new-texrt-twenty:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
